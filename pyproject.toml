[project]
name = "pric"
version = "0.1.0"
description = "Probabilistic image classification"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flax>=0.12.7",
    "jax>=0.11.1",
    "kagglehub>=1.0.2",
    "numpy>=2.4.6",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "typer>=0.27.1",
]

[project.scripts]
pric = "pric.cli:app"

[project.optional-dependencies]
cuda = [
    "jax[cuda13]>=0.11.1",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["D", "F", "PL"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
